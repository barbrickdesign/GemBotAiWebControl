<!-- ═══════ GEMBOT LOADER ═══════ -->
<script>
    (function() {
        const BASE = window.GEMBOT_BASE_URL;
        const config = window.GEMBOT_DOMAIN_CONFIG;
        
        const scripts = [
            'gembot-api.js', 'virtual-machine-3d.js', 'gembot-3d-init.js', 'gembot-farm-game.js',
            'gembot-sync-manager.js', 'gembot-sync-ui.js', 'knowledge-loader.js',
            'merlin-intelligence-system.js', 'merlin-knowledge-integration.js',
            'merlin-tooltip-system.js', 'knowledge-integration-examples.js',
            'gembot-parts-database.js', 'gembot-faceting-designs.js', 'gembot-stl-catalog.js',
            'gembot-game-cards.js', 'gembot-3d-printing.js', 'gembot-troubleshooting.js',
            'gembot-game-master.js', 'merlin-enhanced-responses.js', 'gembot-game-integration.js',
            'gembot-marketplace.js', 'gembot-fantasy-marketplace.js', 'arya-intel-system.js',
            'gembot-3d-world.js', 'quantum-gem-visualizer.js', 'gembot-changelog.js',
            'merlin-knowledge-base.js', 'comprehensive-test.js', 'gembot-academy.js',
            'gembot-panel-manager.js', 'gembot-3d-mirror.js', 'gembot-animations.js',
            'merlin-3d-card-integrated.js', 'GBUV_VAULT_SYSTEM.js', '3d-inventory-system.js',
            'gembot-testing-agent.js', 'ai-agent-players.js', 'ai-agent-logger.js',
            'ai-agent-systems.js', 'ai-agent-news-referral.js', 'solana-wallet-system.js',
            'gembot-automated-wallet-system.js', 'gbuv-distribution-trading.js', 'live-activity-feed.js'
        ];
        
        const stylesheets = [
            'gembot-3d-world.css', 'gembot-academy.css', 'merlin-3d-card-integrated.css',
            '3d-inventory-system.css', 'ai-agent-systems.css'
        ];
        
        let loaded = 0;
        const total = scripts.length;
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = BASE + src;
                script.onload = () => { loaded++; updateProgress(); resolve(); };
                script.onerror = () => { loaded++; updateProgress(); reject(); };
                document.head.appendChild(script);
            });
        }
        
        function loadCSS(href) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = BASE + href;
            document.head.appendChild(link);
        }
        
        function updateProgress() {
            const percent = Math.round((loaded / total) * 100);
            const el = document.querySelector('#gembot-loading div:last-child');
            if (el) el.textContent = `Loading... ${percent}% (${loaded}/${total})`;
        }
        
        function init() {
            console.log(`🚀 Initializing GemBot for ${config.domainName}...`);
            console.log(`🎨 Theme: ${config.domainTheme}`);
            console.log(`🤖 Agent Types:`, config.agentTypes);
            
            stylesheets.forEach(loadCSS);
            
            scripts.reduce((p, s) => p.then(() => loadScript(s)), Promise.resolve())
                .then(() => {
                    console.log(`✅ ${config.domainName} GemBot loaded!`);
                    
                    setTimeout(() => {
                        document.getElementById('gembot-loading')?.remove();
                        
                        // Domain-specific initialization
                        if (window.liveActivityFeed) {
                            window.liveActivityFeed.log('SYSTEM', `${config.domainTheme} online! 🚀`);
                            window.liveActivityFeed.log('MERLIN', config.merlinGreeting);
                        }
                        
                        // Customize Merlin personality
                        if (window.merlinCard) {
                            window.merlinCard.setPersonality(config.merlinPersonality);
                            window.merlinCard.setGreeting(config.merlinGreeting);
                        }
                        
                        // Configure agents with domain theme
                        if (window.aiAgentSystem) {
                            window.aiAgentSystem.setDomainTheme({
                                name: config.domainName,
                                types: config.agentTypes,
                                prefix: config.agentPrefix,
                                count: config.agentCount
                            });
                        }
                    }, 1000);
                })
                .catch(err => {
                    console.error('❌ Error loading GemBot:', err);
                    const el = document.getElementById('gembot-loading');
                    if (el) el.innerHTML = `
                        <div style="color: #ff6b6b;">
                            <div style="font-size: 40px;">⚠️</div>
                            <div>Failed to load GemBot</div>
                            <div style="font-size: 11px; margin-top: 10px;">Check console</div>
                        </div>
                    `;
                });
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
