<!-- ═══════ GEMBOT CORE SCRIPTS ═══════ -->
<script>
    (function() {
        const BASE = window.GEMBOT_BASE_URL || '';
        let loadedScripts = 0;
        const totalScripts = 45; // Update this if adding more scripts
        
        // Script loading order is critical!
        const scripts = [
            // Core API & Logger
            'gembot-api.js',
            
            // 3D Systems
            'virtual-machine-3d.js',
            'gembot-3d-init.js',
            'gembot-farm-game.js',
            
            // Sync System
            'gembot-sync-manager.js',
            'gembot-sync-ui.js',
            
            // Knowledge Base
            'knowledge-loader.js',
            'merlin-intelligence-system.js',
            'merlin-knowledge-integration.js',
            'merlin-tooltip-system.js',
            'knowledge-integration-examples.js',
            
            // Game Systems
            'gembot-parts-database.js',
            'gembot-faceting-designs.js',
            'gembot-stl-catalog.js',
            'gembot-game-cards.js',
            'gembot-3d-printing.js',
            'gembot-troubleshooting.js',
            'gembot-game-master.js',
            'merlin-enhanced-responses.js',
            'gembot-game-integration.js',
            'gembot-marketplace.js',
            'gembot-fantasy-marketplace.js',
            'arya-intel-system.js',
            'gembot-3d-world.js',
            'quantum-gem-visualizer.js',
            'gembot-changelog.js',
            'merlin-knowledge-base.js',
            'comprehensive-test.js',
            
            // Academy & Panel Manager
            'gembot-academy.js',
            'gembot-panel-manager.js',
            'gembot-3d-mirror.js',
            'gembot-animations.js',
            
            // Merlin 3D Card
            'merlin-3d-card-integrated.js',
            
            // GBUV Token System
            'GBUV_VAULT_SYSTEM.js',
            
            // 3D Inventory
            '3d-inventory-system.js',
            
            // Testing Agent
            'gembot-testing-agent.js',
            
            // AI Agent Systems (Player Simulation, Logging, Leaderboard)
            'ai-agent-players.js',
            'ai-agent-logger.js',
            'ai-agent-systems.js',
            'ai-agent-news-referral.js',
            
            // Solana Integration
            'solana-wallet-system.js',
            'gbuv-distribution-trading.js',
            
            // Live Activity Feed (MUST BE LAST)
            'live-activity-feed.js'
        ];
        
        // CSS files
        const stylesheets = [
            'gembot-3d-world.css',
            'gembot-academy.css',
            'merlin-3d-card-integrated.css',
            '3d-inventory-system.css',
            'ai-agent-systems.css'
        ];
        
        function updateProgress() {
            loadedScripts++;
            const percent = Math.round((loadedScripts / totalScripts) * 100);
            const loading = document.getElementById('gembot-loading');
            if (loading) {
                const progressText = loading.querySelector('div:last-child');
                if (progressText) {
                    progressText.textContent = `Loading... ${percent}% (${loadedScripts}/${totalScripts})`;
                }
            }
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = BASE + src;
                script.onload = () => {
                    console.log('✅ Loaded:', src);
                    updateProgress();
                    resolve();
                };
                script.onerror = () => {
                    console.error('❌ Failed to load:', src);
                    updateProgress();
                    reject(new Error(`Failed to load ${src}`));
                };
                document.head.appendChild(script);
            });
        }
        
        function loadStylesheet(href) {
            return new Promise((resolve) => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = BASE + href;
                link.onload = () => {
                    console.log('✅ Loaded stylesheet:', href);
                    resolve();
                };
                link.onerror = () => {
                    console.warn('⚠️ Failed to load stylesheet:', href);
                    resolve(); // Don't block on CSS failures
                };
                document.head.appendChild(link);
            });
        }
        
        // Load everything when DOM is ready
        function initGemBot() {
            console.log('🚀 Initializing GemBot AI Control System on Squarespace...');
            console.log('📁 Base URL:', BASE);
            
            // Load stylesheets first (non-blocking)
            stylesheets.forEach(css => loadStylesheet(css));
            
            // Load scripts in sequence
            scripts.reduce((promise, script) => {
                return promise.then(() => loadScript(script));
            }, Promise.resolve())
            .then(() => {
                console.log('✅ All GemBot systems loaded!');
                
                // Hide loading indicator
                setTimeout(() => {
                    const loading = document.getElementById('gembot-loading');
                    if (loading) {
                        loading.classList.add('hidden');
                        setTimeout(() => loading.remove(), 500);
                    }
                }, 1000);
                
                // Initialize GemBot
                if (typeof initializeGemBot === 'function') {
                    initializeGemBot();
                }
                
                // Show welcome message
                if (window.liveActivityFeed) {
                    setTimeout(() => {
                        window.liveActivityFeed.log('SYSTEM', 'GemBot AI Control System initialized on Squarespace! 🚀');
                        window.liveActivityFeed.log('MERLIN', 'Merlin AI Assistant ready to help!');
                    }, 2000);
                }
            })
            .catch(error => {
                console.error('❌ Error loading GemBot:', error);
                const loading = document.getElementById('gembot-loading');
                if (loading) {
                    loading.innerHTML = `
                        <div style="color: #ff6b6b;">
                            <div style="font-size: 40px; margin-bottom: 15px;">⚠️</div>
                            <div style="font-size: 16px; font-weight: bold; margin-bottom: 10px;">
                                Failed to Load GemBot
                            </div>
                            <div style="font-size: 12px; opacity: 0.8;">
                                Check console for details<br>
                                Verify BASE_URL is correct
                            </div>
                        </div>
                    `;
                }
            });
        }
        
        // Wait for Squarespace to finish loading
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGemBot);
        } else {
            // Squarespace already loaded, init immediately
            initGemBot();
        }
        
        // Expose initialization function globally
        window.initializeGemBot = function() {
            console.log('🎮 GemBot initialization complete');
            
            // Squarespace-specific adjustments
            if (window.GEMBOT_SQUARESPACE_MODE) {
                console.log('🏗️ Applying Squarespace compatibility fixes...');
                
                // Ensure Merlin card doesn't block Squarespace navigation
                const merlinCard = document.getElementById('merlin-ai-card-integrated');
                if (merlinCard) {
                    merlinCard.style.zIndex = '1000000';
                }
                
                // Position activity feed away from Squarespace elements
                const activityFeed = document.getElementById('live-activity-feed');
                if (activityFeed) {
                    activityFeed.style.zIndex = '999998';
                }
            }
        };
    })();
</script>
