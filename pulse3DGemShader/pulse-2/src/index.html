<canvas id="glcanvas"></canvas>
  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  </script>
<script id="fragment-shader" type="x-shader/x-fragment">
#ifdef GL_ES
precision mediump float;
#endif

uniform vec2 u_resolution;
uniform vec2 u_mouse;
uniform float u_time;

vec3 palette2(float t, float factor) {
    vec3 a = vec3(0.5) + 0.3 * sin(vec3(0.1, 0.3, 0.5) * factor);
    vec3 b = vec3(0.5) + 0.3 * cos(vec3(0.2, 0.4, 0.6) * factor);
    vec3 c = vec3(1.0) + 0.5 * sin(vec3(0.3, 0.7, 0.9) * factor);
    vec3 d = vec3(0.25, 0.4, 0.55) + 0.2 * cos(vec3(0.5, 0.6, 0.7) * factor);
    return a + b * cos(6.28318 * (c * t + d));
}
float oscillate(float time, float minVal, float maxVal) {
    float sineWave = sin(time);
    float normalizedSine = (sineWave + 1.0) / 2.0;
    return mix(minVal, maxVal, normalizedSine);
}
  
void main() {
    vec2 st = gl_FragCoord.xy/u_resolution.xy * 2.0 - 1.0;
    st.x *= u_resolution.x/u_resolution.y;
    vec2 st0 = st;
    vec3 finalColor = vec3(0.0);
    for (float i = 2.0; i < 4.0; i++) {
        float d = length(st0);
        float angle = atan(st0.y, st0.x);
        d = sin(sin(-d + u_time * 0.5)/100.0);
        d *= cos(st0.x * 8.0) + cos(st0.y * 16.0) * sin(st0.y * d + u_time * 0.5);
        d *= cos(st0.y * 8.0) + cos(st0.x * 16.0) * sin(st0.x * d + u_time * 0.5);
        d = abs(d);
        vec3 col = palette2(d, 3.5);
        d = pow(0.0002 / d, 0.5);

        finalColor += col * d;
    }
        
    gl_FragColor = vec4(finalColor, 1.0);
}
</script>
