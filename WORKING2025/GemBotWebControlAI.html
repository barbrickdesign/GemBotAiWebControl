<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self' blob: indexeddb: https://cdn.jsdelivr.net; object-src 'none'; img-src 'self' data: blob:;">
    <title>GemBot AI Control System</title>
    
    <!-- TensorFlow.js for ML Analysis -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    
    <!-- PayPal Integration -->
    <script>
        window.PAYPAL_CONFIG = {
            clientId: localStorage.getItem('PAYPAL_CLIENT_ID') || 'YOUR_PAYPAL_CLIENT_ID',
            sandbox: localStorage.getItem('PAYPAL_SANDBOX') !== 'false',
            currency: 'USD'
        };
    </script>
    <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>
    <script src="../paypal-integration.js"></script>
    <script src="../paypal-ui-widget.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #e0e6ed;
            min-height: 100vh;
        }

        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: auto 1fr auto;
            min-height: 100vh;
            gap: 12px;
            padding: 12px;
            max-width: 1800px;
            margin: 0 auto;
        }

        /* HEADER spanning all columns */
        .header-panel {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 1.5s infinite;
        }

        .status-indicator.connected {
            background: #44ff44;
            box-shadow: 0 0 8px #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .connection-panel {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .port-select, .input-field {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            min-height: 36px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 36px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        .btn-scan {
            background: #4facfe;
            color: white;
        }

        .btn-scan:hover {
            background: #3f9ae8;
        }

        .btn-danger {
            background: #ff4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dd0000;
        }

        .hidden {
            display: none !important;
        }

        /* FOOTER Emergency Bar */
        .footer-panel {
            grid-column: 1 / -1;
            background: #8B0000;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .footer-panel button {
            padding: 12px 24px;
            font-size: 14px;
        }

        /* THREE COLUMN LAYOUT */
        .main-content {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 12px;
            min-height: 0;
            max-height: 100%;
        }

        /* LEFT PANEL - MOTOR CONTROLS */
        .left-panel {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 16px;
            overflow-y: auto;
            border: 1px solid #2d3561;
        }

        .control-section {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2d3561;
        }

        .control-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #667eea;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-label {
            font-size: 11px;
            min-width: 45px;
            font-weight: 600;
        }

        .control-input {
            flex: 1;
            min-height: 28px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #2d3561;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: background 0.2s;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #7c8ff5;
        }

        .display-value {
            min-width: 35px;
            text-align: right;
            font-size: 11px;
            font-weight: 700;
            color: #667eea;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        .btn-control {
            padding: 8px;
            background: #2d3561;
            color: #e0e6ed;
            border: 1px solid #3d4571;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-control:hover {
            background: #3d4571;
            border-color: #667eea;
            color: #667eea;
        }

        .btn-control.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .dpad-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            margin-bottom: 8px;
        }

        .dpad-btn {
            padding: 10px;
            background: #2d3561;
            color: #e0e6ed;
            border: 1px solid #3d4571;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .dpad-btn:hover {
            background: #3d4571;
            border-color: #667eea;
        }

        .dpad-btn.up { grid-column: 2; }
        .dpad-btn.left { grid-column: 1; }
        .dpad-btn.down { grid-column: 2; grid-row: 3; }
        .dpad-btn.right { grid-column: 3; }
        .dpad-btn.stop { grid-column: 1 / -1; grid-row: 4; background: #4a2020; }

        /* CENTER PANEL - WEBCAM & ML ANALYSIS */
        .center-panel {
            background: #1a1f3a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2d3561;
            min-height: 0;
            max-height: 100%;
        }

        .camera-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #mlCanvas {
            width: 100%;
            height: 100%;
        }

        .camera-controls {
            padding: 12px;
            background: #0f0f1e;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid #2d3561;
        }

        .camera-controls button {
            flex: 1;
            min-width: 100px;
            padding: 8px 12px;
            font-size: 11px;
        }

        .camera-adjustments {
            padding: 8px 12px;
            background: #1a1f3a;
            border-top: 1px solid #2d3561;
        }

        .camera-adjustments input[type="range"] {
            width: 100%;
            height: 4px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .ml-status {
            padding: 8px 12px;
            background: #1a1f3a;
            border-top: 1px solid #2d3561;
            font-size: 11px;
            text-align: center;
            color: #aaa;
        }

        /* RIGHT PANEL - AI ASSISTANT & STATUS */
        .right-panel {
            background: #1a1f3a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid #2d3561;
            overflow: hidden;
            min-height: 0;
            max-height: 100%;
        }

        .status-display {
            padding: 12px;
            background: #0f0f1e;
            border-bottom: 1px solid #2d3561;
        }

        .status-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        .status-item {
            background: #2d3561;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #3d4571;
        }

        .status-label {
            font-size: 9px;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .status-value {
            font-size: 14px;
            font-weight: 700;
            color: #667eea;
        }

        .ai-assistant {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            max-height: 100%;
        }

        .ai-header {
            padding: 10px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 12px;
            font-weight: 700;
            border-bottom: 1px solid #2d3561;
        }

        .ai-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            max-height: 100%;
            word-wrap: break-word;
            word-break: break-word;
            white-space: normal;
        }

        .ai-message {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            line-height: 1.4;
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
            flex-shrink: 0;
        }

        .ai-message.user {
            background: #2d3561;
            color: #e0e6ed;
            align-self: flex-end;
            max-width: 90%;
        }

        .ai-message.assistant {
            background: #3d4571;
            color: #a8b5e0;
            align-self: flex-start;
            max-width: 90%;
        }

        .ai-message.system {
            background: #2d5f3f;
            color: #6db877;
            align-self: center;
            max-width: 95%;
            text-align: center;
            font-size: 10px;
        }

        .ai-message.error {
            background: #5f2d2d;
            color: #d86b6b;
            align-self: flex-start;
            max-width: 90%;
            border-left: 3px solid #d86b6b;
        }

        .ai-message.info {
            background: #2d4f5f;
            color: #6ba5d8;
            align-self: flex-start;
            max-width: 90%;
            border-left: 3px solid #6ba5d8;
        }

        .ai-message.success {
            background: #2d5f4f;
            color: #6bd89a;
            align-self: flex-start;
            max-width: 90%;
            border-left: 3px solid #6bd89a;
        }

        .ai-message.warning {
            background: #5f5f2d;
            color: #d8d86b;
            align-self: flex-start;
            max-width: 90%;
            border-left: 3px solid #d8d86b;
        }

        .ai-input-area {
            padding: 10px 12px;
            border-top: 1px solid #2d3561;
            display: flex;
            gap: 6px;
        }

        .ai-input-area input {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #3d4571;
            border-radius: 4px;
            background: #2d3561;
            color: #e0e6ed;
            font-size: 11px;
        }

        .ai-input-area button {
            padding: 6px 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        .ai-input-area button:hover {
            background: #7c8ff5;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1f3a;
        }

        ::-webkit-scrollbar-thumb {
            background: #3d4571;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4d5581;
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .app-container {
                grid-template-columns: 200px 1fr 260px;
            }
            .main-content {
                grid-template-columns: 200px 1fr 260px;
            }
        }

        @media (max-width: 1000px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto auto;
            }
            .main-content {
                grid-template-columns: 1fr;
                grid-column: 1;
            }
            .left-panel { order: 1; }
            .center-panel { order: 2; }
            .right-panel { order: 3; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <div class="header-panel">
            <div class="header-title">💎 GEMBOT AI CONTROL</div>
            <div class="status-badge">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="connectionStatus">DISCONNECTED</span>
            </div>
            <div class="connection-panel">
                <button class="btn-scan" id="scanBtn">🔍 SCAN</button>
                <select class="port-select" id="portSelect" aria-label="Select serial port" title="Serial port selector"><option value="">Select Port...</option></select>
                <button class="btn-primary" id="connectBtn">CONNECT</button>
                <button class="btn-danger hidden" id="disconnectBtn">DISCONNECT</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- LEFT: MOTOR CONTROLS -->
            <div class="left-panel">
                <div class="control-section">
                    <div class="section-title">⚡ Speed</div>
                    <div class="control-row">
                        <div class="control-label">Level</div>
                        <input type="range" id="speedSlider" class="control-input" min="1" max="5" value="1" aria-label="Motor speed level">
                        <div class="display-value"><span id="speedDisplay">1</span>/5</div>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">🎛️ Mode</div>
                    <div class="button-grid">
                        <button class="btn-control active" id="btnContinuous">CONTINUOUS</button>
                        <button class="btn-control" id="btnStep">STEP</button>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">📏 Step Size</div>
                    <div class="control-row">
                        <div class="control-label">Steps</div>
                        <input type="range" id="stepSlider" class="control-input" min="1" max="70" value="1" aria-label="Motor step size">
                        <div class="display-value"><span id="stepDisplay">1</span>/70</div>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">🕹️ Movement</div>
                    <div class="dpad-container">
                        <button class="dpad-btn up" data-cmd="w">▲</button>
                        <button class="dpad-btn left" data-cmd="a">◄</button>
                        <button class="dpad-btn right" data-cmd="d">►</button>
                        <button class="dpad-btn down" data-cmd="z">▼</button>
                        <button class="dpad-btn stop" data-cmd="u">STOP</button>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">🔄 Rotation</div>
                    <div class="button-grid">
                        <button class="btn-control" id="btnRotateCCW">CCW</button>
                        <button class="btn-control" id="btnRotateCW">CW</button>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">🎰 Index</div>
                    <div class="button-grid">
                        <button class="btn-control" id="btnIndexBack">◀ BACK</button>
                        <button class="btn-control" id="btnIndexFwd">FWD ▶</button>
                    </div>
                </div>
            </div>

            <!-- CENTER: WEBCAM & ML ANALYSIS -->
            <div class="center-panel">
                <div class="camera-container">
                    <video id="cameraFeed" playsinline autoplay muted></video>
                    <canvas id="mlCanvas" class="camera-overlay"></canvas>
                </div>
                <div class="camera-controls">
                    <button id="cameraStartBtn" style="background: #4a7c2e;">📷 START CAMERA</button>
                    <button id="cameraStopBtn" style="background: #7c2e2e; display: none;">⏹ STOP</button>
                    <button id="recordBtn" style="background: #2e4a7c;">⚫ RECORD</button>
                </div>
                <div class="camera-adjustments">
                    <div style="font-size: 11px; color: #aaa; font-weight: 600; margin: 8px 0 4px 0;">🎨 Image Adjustment
                        <button id="autoAdjustBtn" style="float: right; background: #667eea; color: white; border: none; padding: 2px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: 600;">AUTO</button>
                    </div>
                    <div style="display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; font-size: 11px;">
                        <label for="brightnessSlider" style="color: #aaa;">Brightness:</label>
                        <input type="range" id="brightnessSlider" min="0" max="200" value="100" style="cursor: pointer;" aria-label="Image brightness adjustment">
                        <span id="brightnessValue" style="color: #667eea; font-weight: 600; min-width: 30px;">100%</span>
                    </div>
                    <div style="display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; font-size: 11px; margin-top: 4px;">
                        <label for="contrastSlider" style="color: #aaa;">Contrast:</label>
                        <input type="range" id="contrastSlider" min="0" max="200" value="100" style="cursor: pointer;" aria-label="Image contrast adjustment">
                        <span id="contrastValue" style="color: #667eea; font-weight: 600; min-width: 30px;">100%</span>
                    </div>
                    <div style="display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; font-size: 11px; margin-top: 4px;">
                        <label for="saturationSlider" style="color: #aaa;">Saturation:</label>
                        <input type="range" id="saturationSlider" min="0" max="200" value="100" style="cursor: pointer;" aria-label="Image saturation adjustment">
                        <span id="saturationValue" style="color: #667eea; font-weight: 600; min-width: 30px;">100%</span>
                    </div>
                </div>
                <div class="ml-status"><div id="mlStatus">ML Model Ready • Waiting for camera...</div></div>
            </div>

            <!-- RIGHT: AI ASSISTANT & STATUS -->
            <div class="right-panel">
                <div class="status-display">
                    <div class="section-title">📊 Position</div>
                    <div class="status-box">
                        <div class="status-item"><div class="status-label">X</div><div class="status-value" id="statusX">—</div></div>
                        <div class="status-item"><div class="status-label">Y</div><div class="status-value" id="statusY">—</div></div>
                        <div class="status-item"><div class="status-label">ANGLE</div><div class="status-value" id="statusAngle">—</div></div>
                        <div class="status-item"><div class="status-label">INDEX</div><div class="status-value" id="statusIndex">—</div></div>
                    </div>
                </div>
                <div class="ai-header">🤖 AI ASSISTANT</div>
                <div class="ai-messages" id="aiMessages"></div>
                <div class="ai-input-area">
                    <input type="text" id="aiInput" placeholder="Ask AI for help...">
                    <button id="aiSendBtn">SEND</button>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer-panel">
            <button class="btn-danger" id="emergencyStop">🛑 EMERGENCY STOP</button>
            <button style="background: #2e4a7c; color: white;" id="btnHome">🏠 HOME</button>
            <button style="background: #4a5a8e; color: white;" id="btnDiagnostic">🔧 DIAGNOSTIC</button>
        </div>
    </div>

    <script>
        // ==================== GLOBAL STATE ====================
        let port = null;
        let isConnected = false;
        let motorSpeed = 1;
        let motorMode = 'continuous';
        let motorStepSize = 1;
        let cameraActive = false;
        let recordingActive = false;
        let mlModelLoaded = false;

        const mlState = {
            frameCount: 0,
            confidence: 0,
            detections: [],
            sessionData: [],
            lastSuggestion: ''
        };

        // ==================== WEB SERIAL API ====================
        class GemBotSerial {
            constructor() {
                this.port = null;
                this.isConnected = false;
                this.availablePorts = [];
                this.buffer = '';
            }

            async scanPorts() {
                console.log('%c🔍 SCAN PORTS CALLED', 'color: #00ff00; font-weight: bold; font-size: 14px');
                try {
                    if (!('serial' in navigator)) {
                        console.error('❌ Web Serial API not supported in this browser');
                        addMessage('❌ Web Serial API not supported', 'error');
                        return;
                    }
                    console.log('🔍 Scanning for USB ports...');
                    addMessage('🔍 Scanning for devices...', 'system');
                    let ports = await navigator.serial.getPorts();
                    
                    // If no ports found, try requestPort to allow user to select
                    if (ports.length === 0) {
                        console.log('ℹ️ No paired devices. Requesting new port selection...');
                        addMessage('ℹ️ No paired devices. Opening port selector...', 'info');
                        try {
                            const port = await navigator.serial.requestPort();

                            const productId = info.usbProductId ? '0x' + info.usbProductId.toString(16).padStart(4, '0') : 'Unknown';

            async connect() {
                console.log('%c🔌 CONNECT CALLED', 'color: #00ff00; font-weight: bold; font-size: 14px');
                try {
                    const portSelect = document.getElementById('portSelect');
                    const idx = portSelect.value;
                    if (idx === '') {
                        addMessage('⚠️ Please select a port', 'warning');
                        return;
                    }
                    
                    this.port = this.availablePorts[idx];
                    const info = this.port.getInfo?.() || {};
                    console.log(`📋 Port Info - VID: 0x${info.usbVendorId?.toString(16)}, PID: 0x${info.usbProductId?.toString(16)}`);
                    
                    // Try to close if already open
                    if (this.port.readable || this.port.writable) {
                        try {
                            console.log('🔄 Port already open, closing...');
                            await this.port.close();
                            await new Promise(r => setTimeout(r, 500));
                        } catch (e) {
                            console.log(`⚠️ Close attempt: ${e.message}`);
                        }
                    }
                    
                    const baudRates = [9600, 115200, 230400, 57600, 19200];
                    let connected = false;
                    
                    for (const baudRate of baudRates) {
                        try {
                            console.log(`🔌 Attempting connection at ${baudRate} baud...`);
                            addMessage(`🔌 Trying ${baudRate} baud...`, 'system');
                            await this.port.open({ baudRate, bufferSize: 255 });
                            this.isConnected = true;
                            isConnected = true;
                            console.log(`✅ Connected at ${baudRate} baud!`);
                            addMessage(`✅ Connected at ${baudRate} baud!`, 'success');
                            updateConnectionStatus(true);
                            document.getElementById('connectBtn').classList.add('hidden');
                            document.getElementById('disconnectBtn').classList.remove('hidden');
                            document.getElementById('portSelect').disabled = true;
                            // Initialize firmware speed multiplier to 1 (prevents motor step multiplication)
                            this.sendCommand('s1');
                            this.startReading();
                            connected = true;
                            break;
                        } catch (err) {
                            console.log(`⚠️ Failed at ${baudRate}: ${err.message}`);
                            addMessage(`⚠️ Failed at ${baudRate}: ${err.message}`, 'warning');
                            try { 
                                if (this.port.readable || this.port.writable) {
                                    await this.port.close(); 
                                }
                            } catch (e) {}
                            await new Promise(r => setTimeout(r, 200));
                        }
                    }
                    
                    if (!connected) {
                        addMessage('❌ Could not connect at any baud rate. Try unplugging/replugging the device.', 'error');

                    addMessage(`❌ Connection failed: ${error.message}`, 'error');

            async disconnect() {
                try {
                    if (this.port) {
                        await this.port.close();
                        this.isConnected = false;

                } catch (error) {
                    addMessage(`❌ Disconnect error: ${error.message}`, 'error');
                }
            }

            async startReading() {
                try {
                    while (this.isConnected && this.port?.readable) {
                        const reader = this.port.readable.getReader();
                        try {
                            while (true) {
                                const { value, done } = await reader.read();
                                if (done) break;
                                const text = new TextDecoder().decode(value);
                                this.buffer += text;
                                this.processBuffer();
                            }
                        } finally {
                            reader.releaseLock();
                        }
                    }
                } catch (error) {
                    addMessage(`❌ Reading error: ${error.message}`, 'error');
                }
            }

            processBuffer() {
                const lines = this.buffer.split('\n');
                this.buffer = lines[lines.length - 1];
                
                let menuItems = [];
                let isMenuMode = false;
                
                for (let i = 0; i < lines.length - 1; i++) {
                    const line = lines[i].trim();
                    if (!line || line.length <= 2) continue;
                    
                    // Detect menu start
                    if (line.includes('menu:')) {
                        isMenuMode = true;
                        addMessage('📋 MAIN MENU', 'system');
                        continue;
                    }
                    
                    // Detect menu end (various patterns)
                    if (line.includes('------') || line.includes('Motor Shield') || (isMenuMode && !line.includes('<') && !line.includes(',') && line.includes('Settings'))) {
                        if (menuItems.length > 0) {
                            displayMenuStructured(menuItems);
                            menuItems = [];
                        }
                        isMenuMode = false;
                        continue;
                    }
                    
                    // Parse menu items (format: "< Label , ID" or "Label, ID")
                    const menuMatch = line.match(/^<?(.+?)\s*,\s*(\d+)$/);
                    if (menuMatch && isMenuMode) {
                        const label = menuMatch[1].trim();
                        const id = menuMatch[2];
                        menuItems.push({ label, id, isSubmenu: line.includes('<') });
                        continue;
                    }
                    
                    // Parse position data
                    let x, y, angle, index;
                    
                    if (line.includes('pX:')) {
                        const xMatch = line.match(/pX:(\d+)/);
                        if (xMatch) {
                            x = parseInt(xMatch[1]);
                            updateStatusBox('X', x);
                            console.log(`📨 Serial received: Position X = ${x}`);
                        }
                    }
                    if (line.includes('pY:')) {
                        const yMatch = line.match(/pY:(\d+)/);
                        if (yMatch) {
                            y = parseInt(yMatch[1]);
                            updateStatusBox('Y', y);
                            console.log(`📨 Serial received: Position Y = ${y}`);
                        }
                    }
                    if (line.includes('pA:')) {
                        const aMatch = line.match(/pA:(\d+)/);
                        if (aMatch) {
                            angle = parseInt(aMatch[1]);
                            updateStatusBox('ANGLE', angle);
                            console.log(`📨 Serial received: Angle = ${angle}°`);
                        }
                    }
                    if (line.includes('pI:')) {
                        const iMatch = line.match(/pI:(\d+)/);
                        if (iMatch) {
                            index = parseInt(iMatch[1]);
                            updateStatusBox('INDEX', index);
                            console.log(`📨 Serial received: Index = ${index}`);
                        }
                    }
                    
                    // Log position to session if we have all values
                    if (x !== undefined || y !== undefined || angle !== undefined || index !== undefined) {
                        sessionRecorder.logPositionData(x, y, angle, index);
                    }
                    
                    // Log other messages
                    if (!isMenuMode && !line.includes('pX:') && !line.includes('pY:') && !line.includes('pA:') && !line.includes('pI:') && !line.includes('menu:')) {
                        if (line.includes('Motor Shield')) {
                            addMessage(`⚙️ ${line}`, 'system');
                        } else if (line.length > 3) {
                            console.log(`📥 ${line}`);
                        }
                    }
                }
                
                if (menuItems.length > 0) {
                    this.displayMenu(menuItems);
                }
            }
            
            displayMenu(menuItems) {
                if (menuItems.length === 0) return;
                
                const submenus = menuItems.filter(m => m.isSubmenu);
                const actions = menuItems.filter(m => !m.isSubmenu);
                
                if (submenus.length > 0) {
                    addMessage('═══ SUBMENUS ═══', 'system');
                    submenus.forEach(item => {
                        addMessage(`  ➤ ${item.label}`, 'system');
                    });
                }
                
                if (actions.length > 0) {
                    addMessage('═══ ACTIONS ═══', 'system');
                    actions.forEach(item => {
                        addMessage(`  ○ ${item.label}`, 'system');
                    });
                }
            }

            sendCommand(cmd) {
                try {
                    if (!this.isConnected || !this.port?.writable) return;
                    const writer = this.port.writable.getWriter();
                    console.log(`📡 TRANSMITTING: '${cmd}' (char code ${cmd.charCodeAt(0)}) + newline`);
                    writer.write(new TextEncoder().encode(cmd + '\n'));
                    writer.releaseLock();
                    
                    // Log command to session
                    sessionRecorder.logMotorCommand(cmd);
                } catch (error) {
                    console.error(`❌ Send error: ${error.message}`);
                }
            }
            
            // Emergency stop - send multiple rapid stop commands directly to hardware
            emergencyStop() {
                try {
                    if (!this.isConnected || !this.port?.writable) return;
                    const writer = this.port.writable.getWriter();
                    // Send 5 rapid stop commands in quick succession
                    // This ensures Arduino receives stop signal even if some get lost
                    const stopSignal = 'u\nu\nu\nu\nu\n';
                    writer.write(new TextEncoder().encode(stopSignal));
                    writer.releaseLock();
                    console.log('🛑 Emergency stop sent (5x rapid) - Motors cut to zero power');
                } catch (error) {
                    console.error(`❌ Emergency stop error: ${error.message}`);
                }
            }
        }

        // ==================== TensorFlow.js ML Model ====================
        class GemBotMLModel {
            constructor() {
                this.model = null;
                this.net = null;
                this.analysisHistory = [];
                this.maxHistoryLength = 30;
            }

            async load() {
                try {
                    addMessage('🤖 Loading ML model...', 'system');
                    this.net = await cocoSsd.load();
                    mlModelLoaded = true;
                    addMessage('✅ ML model loaded successfully!', 'success');
                } catch (error) {
                    addMessage(`❌ ML load failed: ${error.message}`, 'error');
                    mlModelLoaded = false;
                }
            }

            async detectObjects(videoElement) {
                try {
                    if (!this.net || !mlModelLoaded) return [];
                    const predictions = await this.net.detect(videoElement);
                    return predictions;
                } catch (error) {
                    console.error('Detection error:', error);
                    return [];
                }
            }

            analyzeFrameFeatures(imageData) {
                const data = imageData.data;
                let brightness = 0, contrast = 0, edgeIntensity = 0;
                
                // Calculate brightness (average luminance)
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    brightness += (r + g + b) / 3;
                }
                brightness = brightness / (data.length / 4);
                
                // Analyze surface characteristics
                const centerX = imageData.width / 2;
                const centerY = imageData.height / 2;
                const centerRadius = Math.min(imageData.width, imageData.height) / 4;
                
                let centerBrightness = 0;
                let pixelCount = 0;
                
                for (let y = centerY - centerRadius; y < centerY + centerRadius; y++) {
                    for (let x = centerX - centerRadius; x < centerX + centerRadius; x++) {
                        const idx = (Math.floor(y) * imageData.width + Math.floor(x)) * 4;
                        if (idx >= 0 && idx < data.length) {
                            centerBrightness += (data[idx] + data[idx+1] + data[idx+2]) / 3;
                            pixelCount++;
                        }
                    }
                }
                centerBrightness = centerBrightness / pixelCount;
                
                return {
                    brightness: Math.round(brightness),
                    centerBrightness: Math.round(centerBrightness),
                    focusQuality: Math.round((centerBrightness / brightness) * 100),
                    timestamp: Date.now()
                };
            }

            generateSmartSuggestion(detections, features) {
                const suggestions = [];
                
                // Brightness-based suggestions
                if (features.brightness < 100) {
                    suggestions.push('💡 Increase lighting for better surface visibility');
                } else if (features.brightness > 200) {
                    suggestions.push('🌟 Good lighting detected - surface clarity optimal');
                }
                
                // Focus quality suggestions
                if (features.focusQuality > 90) {
                    suggestions.push('🎯 Excellent focus alignment - perfect for precision cuts');
                } else if (features.focusQuality < 70) {
                    suggestions.push('⚠️ Adjust positioning for better center focus');
                }
                
                // Detection-based suggestions
                if (detections.length > 0) {
                    const maxConfidence = Math.max(...detections.map(d => d.score));
                    if (maxConfidence > 0.8) {
                        suggestions.push('✨ Clear object detection - proceed with confidence');
                    } else if (maxConfidence > 0.6) {
                        suggestions.push('🔍 Moderate visibility - consider adjusting angle');
                    }
                }
                
                // Speed optimization
                if (features.brightness > 150 && detections.length > 0) {
                    suggestions.push('⚡ Lighting optimal - can increase cutting speed');
                }
                
                return suggestions.length > 0 ? suggestions[Math.floor(Math.random() * suggestions.length)] : '🤖 Monitoring in progress...';
            }
        }

        // ==================== SESSION RECORDING ====================
        class SessionRecorder {
            constructor() {
                this.isRecording = false;
                this.mediaRecorder = null;
                this.recordedChunks = [];
                this.sessionData = {
                    startTime: null,
                    frames: [],
                    motorCommands: [],
                    positionData: []
                };
            }

            async startRecording(stream) {
                try {
                    this.isRecording = true;
                    this.recordedChunks = [];
                    this.sessionData = {
                        startTime: Date.now(),
                        frames: [],
                        motorCommands: [],
                        positionData: []
                    };
                    
                    const mimeType = 'video/webm';
                    this.mediaRecorder = new MediaRecorder(stream, { mimeType });
                    
                    this.mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            this.recordedChunks.push(e.data);
                        }
                    };
                    
                    this.mediaRecorder.onstop = () => {
                        this.saveSession();
                    };
                    
                    this.mediaRecorder.start();
                    addMessage('🔴 Session recording started', 'system');
                } catch (error) {
                    addMessage(`❌ Recording error: ${error.message}`, 'error');
                }
            }

            stopRecording() {
                if (this.mediaRecorder && this.isRecording) {
                    this.mediaRecorder.stop();
                    this.isRecording = false;
                    addMessage('⏹ Session recording stopped - processing...', 'system');
                }
            }

            logMotorCommand(cmd) {
                if (this.isRecording) {
                    this.sessionData.motorCommands.push({
                        command: cmd,
                        timestamp: Date.now() - this.sessionData.startTime
                    });
                }
            }

            logPositionData(x, y, angle, index) {
                if (this.isRecording) {
                    this.sessionData.positionData.push({
                        x, y, angle, index,
                        timestamp: Date.now() - this.sessionData.startTime,
                        frameCount: mlState.frameCount
                    });
                }
            }

            logFrameAnalysis(features, detections) {
                if (this.isRecording) {
                    this.sessionData.frames.push({
                        frameNumber: mlState.frameCount,
                        features,
                        detectionCount: detections.length,
                        maxConfidence: detections.length > 0 ? Math.max(...detections.map(d => d.score)) : 0,
                        timestamp: Date.now() - this.sessionData.startTime
                    });
                }
            }

            async saveSession() {
                try {
                    const blob = new Blob(this.recordedChunks, { type: 'video/webm' });
                    const sessionBlob = new Blob([JSON.stringify(this.sessionData)], { type: 'application/json' });
                    
                    const sessionId = Date.now();
                    const db = await this.openIndexDB();
                    const tx = db.transaction('sessions', 'readwrite');
                    const store = tx.objectStore('sessions');
                    
                    store.add({
                        id: sessionId,
                        videoBlob: blob,
                        dataJSON: sessionBlob,
                        timestamp: new Date(),
                        duration: this.sessionData.startTime ? Date.now() - this.sessionData.startTime : 0,
                        commandCount: this.sessionData.motorCommands.length,
                        frameCount: this.sessionData.frames.length
                    });
                    
                    addMessage(`✅ Session saved (ID: ${sessionId}) - ${this.sessionData.motorCommands.length} commands, ${this.sessionData.frames.length} frames analyzed`, 'system');
                } catch (error) {
                    addMessage(`⚠️ Session save error: ${error.message}`, 'error');
                }
            }

            async openIndexDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('GemBotSessions', 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('sessions')) {
                            db.createObjectStore('sessions', { keyPath: 'id' });
                        }
                    };
                });
            }
        }
