        function autoAdjustImage() {
            // Analyze current frame and adjust for optimal ML detection
            const canvas = document.getElementById('mlCanvas');
            if (!canvasCtx || canvas.width === 0) return;
            
            const imageData = canvasCtx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // Detailed image quality analysis
            let brightness = 0, darkPixels = 0, brightPixels = 0;
            let rChannel = 0, gChannel = 0, bChannel = 0;
            let pixelCount = data.length / 4;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                const gray = (r + g + b) / 3;
                brightness += gray;
                rChannel += r;
                gChannel += g;
                bChannel += b;
                if (gray < 50) darkPixels++;
                if (gray > 200) brightPixels++;
            }
            
            brightness = brightness / pixelCount;
            const colorBalance = Math.max(rChannel, gChannel, bChannel) / Math.min(rChannel, gChannel, bChannel);
            const dynamicRange = (brightPixels + darkPixels) / pixelCount;
            
            // Calculate optimal adjustments
            let targetBrightness = 100;
            let targetContrast = 100;
            let targetSaturation = 100;
            
            // Brightness: target range is 110-140 for best ML detection
            if (brightness < 80) {
                targetBrightness = Math.min(200, 100 + (80 - brightness) * 1.2);
            } else if (brightness > 180) {
                targetBrightness = Math.max(60, 100 - (brightness - 180) * 0.8);
            } else if (brightness < 110 || brightness > 140) {
                targetBrightness = Math.max(70, Math.min(150, 100 + (128 - brightness) * 0.4));
            }
            
            // Contrast: boost if image looks flat (low dynamic range)
            if (dynamicRange < 0.15) {
                targetContrast = Math.min(180, 100 + (0.15 - dynamicRange) * 400);
            } else if (dynamicRange > 0.4) {
                targetContrast = Math.max(80, 100 - (dynamicRange - 0.4) * 100);
            }
            
            // Saturation: boost for better color detection, but not too much
            targetSaturation = Math.min(140, Math.max(90, 100 + (colorBalance - 1) * 50));
            
            // Apply adjustments
            document.getElementById('brightnessSlider').value = Math.round(targetBrightness);
            document.getElementById('brightnessValue').textContent = Math.round(targetBrightness) + '%';
            document.getElementById('contrastSlider').value = Math.round(targetContrast);
            document.getElementById('contrastValue').textContent = Math.round(targetContrast) + '%';
            document.getElementById('saturationSlider').value = Math.round(targetSaturation);
            document.getElementById('saturationValue').textContent = Math.round(targetSaturation) + '%';
            
            console.log(`Auto-adjust: Brightness ${Math.round(brightness)} → ${Math.round(targetBrightness)}%, DynRange ${(dynamicRange*100).toFixed(0)}% → Contrast ${Math.round(targetContrast)}%`);
            addMessage(`✨ Optimized • Brightness: ${Math.round(targetBrightness)}% • Contrast: ${Math.round(targetContrast)}% • Saturation: ${Math.round(targetSaturation)}%`, 'system');
        }

        async function processVideoFrames() {
            if (!cameraActive) return;
            const video = document.getElementById('cameraFeed');
            const canvas = document.getElementById('mlCanvas');
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Apply image adjustments via canvas filters
                const brightness = parseInt(document.getElementById('brightnessSlider').value) / 100;
                const contrast = parseInt(document.getElementById('contrastSlider').value) / 100;
                const saturation = parseInt(document.getElementById('saturationSlider').value) / 100;
                
                canvasCtx.filter = `brightness(${brightness}) contrast(${contrast}) saturate(${saturation})`;
                canvasCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
                canvasCtx.filter = 'none';
                
                mlState.frameCount++;
                
                // Extract frame data for feature analysis every frame
                const frameImageData = canvasCtx.getImageData(0, 0, canvas.width, canvas.height);
                const features = mlModel.analyzeFrameFeatures(frameImageData);
                
                // Run ML detection every 30 frames
                if (mlState.frameCount % 30 === 0 && mlModelLoaded) {
                    const predictions = await mlModel.detectObjects(video);
                    mlState.detections = predictions;
                    
                    // Log frame analysis to session
                    sessionRecorder.logFrameAnalysis(features, predictions);
                    
                    if (predictions.length > 0) {
                        mlState.confidence = Math.max(...predictions.map(p => p.score)) * 100;
                        console.log(`🎯 Detection: ${predictions.length} objects found. Confidence: ${mlState.confidence.toFixed(0)}%`);
                        
                        // Draw bounding boxes
                        predictions.forEach(prediction => {
                            const [x, y, width, height] = prediction.bbox;
                            canvasCtx.strokeStyle = '#00ff00';
                            canvasCtx.lineWidth = 2;
                            canvasCtx.strokeRect(x, y, width, height);
                            canvasCtx.fillStyle = '#00ff00';
                            canvasCtx.font = '12px Arial';
                            canvasCtx.fillText(`${prediction.class} ${(prediction.score * 100).toFixed(0)}%`, x, y - 5);
                        });
                    } else {
                        console.log('🔍 No objects detected');
                    }
                    
                    // Generate smart suggestions every 300 frames (5 seconds at 60FPS) and only if different
                    if (mlState.frameCount % 300 === 0) {
                        const suggestion = mlModel.generateSmartSuggestion(predictions, features);
                        if (suggestion !== mlState.lastSuggestion) {
                            console.log(`💡 New suggestion: ${suggestion}`);
                            addMessage(suggestion, 'assistant');
                            mlState.lastSuggestion = suggestion;
                        }
                    }
                }
                
                // Update ML status with real feature data
                const statusText = `🔴 Recording • Frame: ${mlState.frameCount} • Brightness: ${features.brightness} • Focus: ${features.focusQuality}%`;
                document.getElementById('mlStatus').textContent = statusText;
            }
            
            requestAnimationFrame(processVideoFrames);
        }

        // ==================== GLOBAL MOTOR STATE ====================
        const activeHoldIntervals = new Map(); // Track all active D-pad intervals globally
        let motorKilled = false; // Flag to block commands during emergency stop

        // ==================== EVENT LISTENERS ====================
        function initializeEventListeners() {
            console.log('%c🔧 INITIALIZING EVENT LISTENERS', 'color: #667eea; font-weight: bold; font-size: 14px; background: #0a0e27; padding: 5px');
            
            const scanBtn = document.getElementById('scanBtn');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            console.log('Button check:', { scanBtn: !!scanBtn, connectBtn: !!connectBtn, disconnectBtn: !!disconnectBtn });
            
            if (!scanBtn) console.error('❌ scanBtn NOT FOUND in DOM');
            if (!connectBtn) console.error('❌ connectBtn NOT FOUND in DOM');
            if (!disconnectBtn) console.error('❌ disconnectBtn NOT FOUND in DOM');
            
            document.getElementById('scanBtn')?.addEventListener('click', () => {
                console.log('%c📡 SCAN button clicked', 'color: #ffff00; font-weight: bold; font-size: 12px');
                serial.scanPorts();
            });
            document.getElementById('connectBtn')?.addEventListener('click', () => {
                console.log('%c🔌 CONNECT button clicked', 'color: #ffff00; font-weight: bold; font-size: 12px');
                serial.connect();
            });
            document.getElementById('disconnectBtn')?.addEventListener('click', () => {
                console.log('%c❌ DISCONNECT button clicked', 'color: #ffff00; font-weight: bold; font-size: 12px');
                serial.disconnect();
            });

            document.getElementById('cameraStartBtn')?.addEventListener('click', () => {
                console.log('📷 CAMERA START button clicked');
                startCamera();
            });
            document.getElementById('cameraStopBtn')?.addEventListener('click', () => {
                console.log('⏹ CAMERA STOP button clicked');
                stopCamera();
            });
            
            document.getElementById('recordBtn')?.addEventListener('click', async () => {
                if (!cameraActive) {
                    addMessage('⚠️ Please start camera first', 'warning');
                    return;
                }
                
                recordingActive = !recordingActive;
                const btn = document.getElementById('recordBtn');
                
                if (recordingActive) {
                    const video = document.getElementById('cameraFeed');
                    if (video.srcObject) {
                        sessionRecorder.startRecording(video.srcObject);
                        btn.style.background = '#c41e3a';
                        btn.textContent = '⏹ STOP RECORD';
                    }
                } else {
                    sessionRecorder.stopRecording();
                    btn.style.background = '#2e4a7c';
                    btn.textContent = '⚫ RECORD';
                }
            });

            document.getElementById('speedSlider')?.addEventListener('input', (e) => {
                motorSpeed = parseInt(e.target.value);
                document.getElementById('speedDisplay').textContent = motorSpeed;
                // DON'T send any speed command to firmware - firmware multiplier makes motor run LONGER
                // Web layer controls speed via command interval frequency only
                // Speed 1: 40ms interval = slowest
                // Speed 5: 8ms interval = fastest
                const intervalMs = Math.max(8, Math.floor(40 / motorSpeed));
                console.log(`⚡ Speed changed to level ${motorSpeed} (${intervalMs}ms interval - ${(1000/intervalMs).toFixed(0)} Hz)`);
                addMessage(`⚡ Speed: ${motorSpeed}/5 - Command interval now ${intervalMs}ms`, 'system');
            });

            document.getElementById('btnContinuous')?.addEventListener('click', () => {
                motorMode = 'continuous';
                document.getElementById('btnContinuous').classList.add('active');
                document.getElementById('btnStep').classList.remove('active');
                addMessage('🎮 CONTINUOUS MODE ACTIVE - Hold down arrow buttons to move (U/D for Y-axis, L/R for X-axis)', 'system');
                if (isConnected) serial.sendCommand('y');
            });

            document.getElementById('btnStep')?.addEventListener('click', () => {
                motorMode = 'step';
                document.getElementById('btnStep').classList.add('active');
                document.getElementById('btnContinuous').classList.remove('active');
                addMessage('✓ STEP MODE ACTIVE - Each button click = single step', 'system');
                if (isConnected) serial.sendCommand('y');
            });

            document.getElementById('stepSlider')?.addEventListener('input', (e) => {
                motorStepSize = parseInt(e.target.value);
                document.getElementById('stepDisplay').textContent = motorStepSize;
                if (isConnected) serial.sendCommand('n' + motorStepSize);
            });

            document.querySelectorAll('.dpad-btn').forEach(btn => {
                const btnId = btn.dataset.cmd; // Use command as unique identifier
                const btnClass = btn.className; // Get button class to identify axis buttons
                const isXAxisBtn = btnClass.includes('left') || btnClass.includes('right');
                const isYAxisBtn = btnClass.includes('up') || btnClass.includes('down');
                
                btn.addEventListener('mousedown', () => {
                    if (motorKilled) {
                        console.warn('🛑 Motor killed - ignoring command');
                        return;
                    }
                    let cmd = btn.dataset.cmd;
                    if (cmd === 'u') return; // Skip for stop button
                    
                    // Map to appropriate firmware commands based on mode
                    // Firmware limitation: Only has continuous LEFT/UP/DOWN/P-CCW
                    // So we use single-step for RIGHT/P-CW and repeat them
                    
                    if (motorMode === 'step') {
                        // STEP mode: Single step per click
                        console.log(`📍 STEP button clicked - Original cmd: ${btn.dataset.cmd}, Button classes: ${btn.className}`);
                        // CRITICAL: Map based on original button values BEFORE modifying
                        // Store original for comparison
                        const originalCmd = cmd;
                        if (originalCmd === 'w') cmd = 'e'; // UP: 'w' -> 'e' (single)
                        else if (originalCmd === 'z') cmd = 'i'; // DOWN: 'z' -> 'i' (single)
                        else if (originalCmd === 'a') cmd = 'd'; // LEFT: 'a' -> 'd' (single)
                        else if (originalCmd === 'd') cmd = 'f'; // RIGHT: 'd' -> 'f' (single)
                        console.log(`🎮 STEP MODE - Mapped to firmware command: ${cmd}`);
                        console.log(`🎮 Sending to Arduino: '${cmd}' (char code ${cmd.charCodeAt(0)})`);
                        if (isConnected) serial.sendCommand(cmd);
                        return; // Exit early - no interval for step mode
                    }
                    
                    // CONTINUOUS mode
                    // Firmware has handlers for: a (LEFT), w (UP), z (DOWN), j (P-CCW)
                    // For RIGHT and P-CW, use repeated single-step commands
                    let useSingleStep = false;
                    if (cmd === 'd') {
                        // X RIGHT: Use repeated 'f' command since firmware lacks motorXRight handler
                        cmd = 'f';
                        useSingleStep = true;
                    }
                    
                    console.log(`🎮 DPAD button held (${motorMode} mode): ${cmd}${useSingleStep ? ' (repeated single-step)' : ''}`);
                    if (isConnected) {
                        serial.sendCommand(cmd);
                        // Send continuous commands while held - interval scales with speed
                        // Speed 1: 40ms interval, Speed 2: 20ms, Speed 5: 8ms (minimum)
                        const interval = Math.max(8, Math.floor(40 / motorSpeed));
                        console.log(`⚡ Command repeat interval: ${interval}ms (speed level ${motorSpeed})`);
                        const intervalId = setInterval(() => {
                            if (!motorKilled && isConnected) serial.sendCommand(cmd);
                            else clearInterval(intervalId); // Stop loop if motor killed
                        }, interval);
                        // Track this interval globally so emergency stop can kill it
                        activeHoldIntervals.set(btnId, intervalId);
                    } else {
                        console.warn('⚠️ Not connected to Arduino');
                    }
                });
                
                btn.addEventListener('mouseup', () => {
                    console.log('🎮 DPAD button released - sending immediate stop');
                    // Clear interval FIRST before sending stop
                    const interval = activeHoldIntervals.get(btnId);
                    if (interval) {
                        clearInterval(interval);
                        activeHoldIntervals.delete(btnId);
                    }
                    // ALWAYS send stop immediately on button release (no delay, no conditions)
                    if (!motorKilled && isConnected) serial.sendCommand('u');
                });
                
                btn.addEventListener('mouseleave', () => {
                    console.log('🎮 Mouse left button - sending immediate stop');
                    // Clear interval FIRST before sending stop
                    const interval = activeHoldIntervals.get(btnId);
                    if (interval) {
                        clearInterval(interval);
                        activeHoldIntervals.delete(btnId);
                        // Send stop immediately when dragging off button
                        if (!motorKilled && isConnected) serial.sendCommand('u');
                    }
                });
                
                // Touch support for mobile
                btn.addEventListener('touchstart', (e) => {
                    if (motorKilled) {
                        console.warn('🛑 Motor killed - ignoring command');
                        return;
                    }
                    let cmd = btn.dataset.cmd;
                    if (cmd === 'u') return;
                    e.preventDefault();
                    
                    // Map to appropriate firmware commands based on mode
                    if (motorMode === 'step') {
                        // STEP mode: Single step per click
                        console.log(`📍 STEP button touched - Original cmd: ${btn.dataset.cmd}, Button classes: ${btn.className}`);
                        const originalCmd = cmd; // PRESERVE ORIGINAL BUTTON VALUE
                        if (originalCmd === 'w') cmd = 'e'; // UP: single
                        if (originalCmd === 'z') cmd = 'i'; // DOWN: single
                        if (originalCmd === 'a') cmd = 'd'; // LEFT: single
                        if (originalCmd === 'd') cmd = 'f'; // RIGHT: single
                        console.log(`🎮 STEP MODE (touch) - Mapped to firmware command: ${cmd}`);
                        console.log(`🎮 Sending to Arduino: '${cmd}' (char code ${cmd.charCodeAt(0)})`);
                        if (isConnected) serial.sendCommand(cmd);
                        return;
                    }
                    
                    // CONTINUOUS mode with firmware workaround
                    let useSingleStep = false;
                    if (cmd === 'd') {
                        cmd = 'f'; // X RIGHT: use repeated single-step
                        useSingleStep = true;
                    }
                    
                    console.log(`🎮 DPAD touched (${motorMode} mode): ${cmd}${useSingleStep ? ' (repeated)' : ''}`);
                    if (isConnected) {
                        serial.sendCommand(cmd);
                        // Dynamic interval: Speed 1: 40ms, Speed 5: 8ms (minimum)
                        const interval = Math.max(8, Math.floor(40 / motorSpeed));
                        console.log(`⚡ Touch repeat interval: ${interval}ms (speed level ${motorSpeed})`);
                        const intervalId = setInterval(() => {
                            if (!motorKilled && isConnected) serial.sendCommand(cmd);
                            else clearInterval(intervalId);
                        }, interval);
                        activeHoldIntervals.set(btnId, intervalId);
                    }
                });
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    console.log('🎮 Touch ended - sending immediate stop');
                    const interval = activeHoldIntervals.get(btnId);
                    if (interval) {
                        clearInterval(interval);
                        activeHoldIntervals.delete(btnId);
                    }
                    // ALWAYS send stop immediately on touch release
                    if (!motorKilled && isConnected) serial.sendCommand('u');
                });
            });

            document.getElementById('btnRotateCCW')?.addEventListener('click', () => {
                console.log('🔄 Rotate CCW button pressed');
                if (isConnected) serial.sendCommand('j');
                else console.warn('⚠️ Not connected');
            });

            document.getElementById('btnRotateCW')?.addEventListener('click', () => {
                console.log('🔄 Rotate CW button pressed');
                if (isConnected) serial.sendCommand('e');
                else console.warn('⚠️ Not connected');
            });

            document.getElementById('btnIndexBack')?.addEventListener('click', () => {
                console.log('📍 Index Back button pressed');
                if (isConnected) serial.sendCommand('i');
                else console.warn('⚠️ Not connected');
            });

            document.getElementById('btnIndexFwd')?.addEventListener('click', () => {
                console.log('📍 Index Forward button pressed');
                if (isConnected) serial.sendCommand('c');
                else console.warn('⚠️ Not connected');
            });

            document.getElementById('emergencyStop')?.addEventListener('click', () => {
                console.error('🛑 EMERGENCY STOP BUTTON PRESSED - KILLING ALL MOTORS IMMEDIATELY');
                
                // IMMEDIATELY set flag to block any new commands
                motorKilled = true;
                
                // IMMEDIATELY clear ALL active intervals (DO NOT WAIT)
                activeHoldIntervals.forEach((interval, btnId) => {
                    clearInterval(interval);
                    console.log(`  ⚡ Killed interval for: ${btnId}`);
                });
                activeHoldIntervals.clear();
                
                // Display emergency stop message
                addMessage('🛑 EMERGENCY STOP ACTIVATED - ALL MOTORS KILLED', 'error');
                
                // Send emergency stop with multiple rapid commands
                if (isConnected) {
                    console.log('📡 Sending emergency stop commands...');
                    serial.emergencyStop();
                }
                
                // Reset motorKilled flag after 500ms to allow new commands
                setTimeout(() => {
                    motorKilled = false;
                    console.log('✅ Motor commands re-enabled');
                }, 500);
            });

            document.getElementById('btnHome')?.addEventListener('click', () => {
                if (isConnected) serial.sendCommand('h');
            });

            // Diagnostic button
            document.getElementById('btnDiagnostic')?.addEventListener('click', () => {
                console.log('🔧 DIAGNOSTIC REPORT GENERATED');
                const diagnostics = {
                    'Connection Status': isConnected ? '✅ Connected' : '❌ Disconnected',
                    'Camera Status': cameraActive ? '✅ Active' : '❌ Stopped',
                    'ML Model Status': mlModelLoaded ? '✅ Loaded' : '❌ Not loaded',
                    'Recording Status': recordingActive ? '🔴 Recording' : '⚫ Stopped',
                    'Motor Speed Level': motorSpeed,
                    'Motor Mode': motorMode === 'continuous' ? 'CONTINUOUS' : 'STEP',
                    'Step Size': motorStepSize,
                    'ML Detections (lifetime)': mlState.detections.length,
                    'Frames Processed': mlState.frameCount,
                    'Last Suggestion': mlState.lastSuggestion || 'None yet',
                    'Browser': navigator.userAgent.split(' ').slice(-2).join(' '),
                    'Timestamp': new Date().toLocaleString()
                };
                
                addMessage('🔧 DIAGNOSTIC REPORT', 'system');
                Object.entries(diagnostics).forEach(([key, value]) => {
                    addMessage(`  ${key}: ${value}`, 'info');
                });
                
                // Log to console as well
                console.table(diagnostics);
                addMessage('✅ Diagnostic report sent to console', 'success');
            });
            document.getElementById('brightnessSlider')?.addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById('brightnessValue').textContent = val + '%';
                console.log(`🔆 Brightness set to ${val}%`);
            });

            document.getElementById('contrastSlider')?.addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById('contrastValue').textContent = val + '%';
                console.log(`📊 Contrast set to ${val}%`);
            });

            document.getElementById('saturationSlider')?.addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById('saturationValue').textContent = val + '%';
                console.log(`🎨 Saturation set to ${val}%`);
            });

            document.getElementById('autoAdjustBtn')?.addEventListener('click', autoAdjustImage);

            document.getElementById('aiSendBtn')?.addEventListener('click', () => {
                const input = document.getElementById('aiInput');
                const message = input.value.trim();
                if (message) {
                    addMessage(message, 'user');
                    setTimeout(() => {
                        const responses = [
                            '✨ Great question! Based on current cutting parameters...',
                            '🎯 Smart thinking! Let me analyze the situation...',
                            '💡 Excellent observation! Current settings are optimal for...',
                            '🔍 Analyzing data... I recommend...'
                        ];
                        addMessage(responses[Math.floor(Math.random() * responses.length)], 'assistant');
                    }, 300);
                    input.value = '';
                }
            });

            document.getElementById('aiInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('aiSendBtn').click();
            });
        }

        // Initialize immediately to ensure all listeners are attached
        initializeEventListeners();
        
        console.log('✅ Event listeners initialized');

        // ==================== COMPREHENSIVE DIAGNOSTICS ====================
        setTimeout(() => {
            console.log("%c🔍 GEMBOT CONTROL AI - COMPLETE DIAGNOSTICS", "color: #667eea; font-size: 16px; font-weight: bold; background: #0a0e27; padding: 10px;");
            
            // 1. Check if libraries loaded
            console.group("📚 LIBRARY STATUS");
            console.log("✅ TensorFlow.js available:", typeof tf !== 'undefined');
            console.log("✅ COCO-SSD available:", typeof cocoSsd !== 'undefined');
            console.log("✅ Web Serial API available:", typeof navigator.serial !== 'undefined');
            console.log("✅ getUserMedia available:", typeof navigator.mediaDevices !== 'undefined');
            console.log("✅ IndexedDB available:", typeof indexedDB !== 'undefined');
            console.groupEnd();
            
            // 2. Check if classes initialized
            console.group("🏗️ CLASS STATUS");
            console.log("✅ GemBotSerial class:", typeof serial === 'object' ? `initialized as ${serial.constructor.name}` : 'MISSING');
            console.log("✅ GemBotMLModel class:", typeof mlModel === 'object' ? `initialized as ${mlModel.constructor.name}` : 'MISSING');
            console.log("✅ SessionRecorder class:", typeof sessionRecorder === 'object' ? `initialized as ${sessionRecorder.constructor.name}` : 'MISSING');
            console.groupEnd();
            
            // 3. Check if functions exist
            console.group("⚙️ FUNCTION STATUS");
            console.log("✅ addMessage:", typeof addMessage === 'function' ? 'ready' : 'MISSING');
            console.log("✅ startCamera:", typeof startCamera === 'function' ? 'ready' : 'MISSING');
            console.log("✅ stopCamera:", typeof stopCamera === 'function' ? 'ready' : 'MISSING');
            console.log("✅ autoAdjustImage:", typeof autoAdjustImage === 'function' ? 'ready' : 'MISSING');
            console.log("✅ processVideoFrames:", typeof processVideoFrames === 'function' ? 'ready' : 'MISSING');
            console.groupEnd();
            
            // 4. Check if all buttons exist
            console.group("🔘 BUTTON STATUS");
            const buttonIds = ['scanBtn', 'connectBtn', 'disconnectBtn', 'cameraStartBtn', 'cameraStopBtn', 'recordBtn', 'btnContinuous', 'btnStep', 'btnRotateCCW', 'btnRotateCW', 'btnIndexBack', 'btnIndexFwd', 'emergencyStop', 'btnHome', 'btnDiagnostic'];
            let buttonsFound = 0;
            buttonIds.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    console.log(`✅ ${id}: exists`);
                    buttonsFound++;
                } else {
                    console.log(`❌ ${id}: MISSING`);
                }
            });
            console.log(`\n📊 Total: ${buttonsFound}/${buttonIds.length} buttons found`);
            console.groupEnd();
            
            // 5. Check all required elements
            console.group("📦 ELEMENT STATUS");
            const elementIds = ['cameraFeed', 'mlCanvas', 'aiMessages', 'portSelect', 'speedSlider', 'stepSlider', 'brightnessSlider', 'contrastSlider', 'saturationSlider', 'statusX', 'statusY', 'statusAngle', 'statusIndex'];
            let elementsFound = 0;
            elementIds.forEach(id => {
                const elem = document.getElementById(id);
                if (elem) {
                    elementsFound++;
                    console.log(`✅ ${id}: exists`);
                } else {
                    console.log(`❌ ${id}: MISSING`);
                }
            });
            console.log(`\n📊 Total: ${elementsFound}/${elementIds.length} elements found`);
            console.groupEnd();
            
            // 6. System state
            console.group("🎮 SYSTEM STATE");
            console.log("isConnected:", isConnected);
            console.log("cameraActive:", cameraActive);
            console.log("recordingActive:", recordingActive);
            console.log("motorSpeed:", motorSpeed);
            console.log("motorMode:", motorMode);
            console.log("mlModelLoaded:", mlModelLoaded);
            console.log("mlState.frameCount:", mlState.frameCount);
            console.groupEnd();
            
            // 7. Test button clicks
            console.group("🧪 BUTTON CLICK TEST");
            console.log("Testing if buttons are clickable...");
            document.getElementById('scanBtn')?.addEventListener('click', () => {
                console.log('%c🎯 SCAN BUTTON SUCCESSFULLY TRIGGERED', 'color: #ff00ff; font-size: 14px; font-weight: bold');
            }, { once: true });
            console.log("✅ SCAN button listener added for test");
            console.groupEnd();
            
            // 8. Summary
            console.log("%c✅ DIAGNOSTICS COMPLETE", "color: #51cf66; font-size: 14px; font-weight: bold; background: #0a0e27; padding: 5px;");
            console.log("%c💡 NEXT STEPS:", "color: #667eea; font-weight: bold;");
            console.log("1. Click '🔍 SCAN' button to scan for Arduino ports");
            console.log("2. Select a port and click 'CONNECT'");
            console.log("3. Click '📷 START CAMERA' to begin video feed");
            console.log("4. Wait for ML model to load (~5-10 seconds)");
            console.log("5. Point camera at objects to test detection");
            console.log("6. Use DPAD buttons to test motor commands");
            
        }, 500);

        // ==================== RESPONSIVE DESIGN MONITORING ====================
        function checkResponsiveBreakpoint() {
            const width = window.innerWidth;
            let breakpoint = 'Desktop (3-column)';
            if (width <= 1000) {
                breakpoint = 'Mobile (1-column stack)';
            } else if (width <= 1400) {
                breakpoint = 'Tablet (adaptive 2-3 column)';
            }
            console.log(`📱 Viewport: ${width}px → ${breakpoint}`);
        }

        window.addEventListener('resize', checkResponsiveBreakpoint);
        checkResponsiveBreakpoint(); // Log initial breakpoint

        // ==================== CSS LAYOUT VALIDATION ====================
        console.log('✅ CSS Layout: Right panel height constraints applied');
        console.log('✅ CSS Layout: Chat container max-height: 100% with overflow-y: auto');
        console.log('✅ CSS Layout: Flex containers have min-height: 0 to prevent stretching');

        // Initialize ML Model and System
        mlModel = new GemBotMLModel();
        addMessage('🤖 GemBot AI System Ready', 'system');
        addMessage('👋 Welcome! Connect Arduino, start camera, and I\'ll help optimize your cuts!', 'assistant');
    </script>
